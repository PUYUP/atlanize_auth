services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: better-auth-express-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

# No database service here: PostgreSQL is hosted on Supabase, reached via
# DATABASE_URL in .env. Add one only if you need a local Postgres for
# offline development, e.g. `docker compose --profile local-db up`.
